<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1330"/><stop offset="0.55" stop-color="#152252"/><stop offset="1" stop-color="#1d2f6b"/>
    </linearGradient>
    <linearGradient id="freedom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="beam1" gradientUnits="userSpaceOnUse" x1="300" y1="210" x2="370" y2="210">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity="0.15"/><stop offset="1" stop-color="#8ab4ff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="beam2" gradientUnits="userSpaceOnUse" x1="790" y1="210" x2="850" y2="210">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity="0.15"/><stop offset="1" stop-color="#34d399" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <g opacity="0.10" stroke="#9db4ff" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200M0 360H1200"/>
    <path d="M60 0V420M180 0V420M300 0V420M420 0V420M540 0V420M660 0V420M780 0V420M900 0V420M1020 0V420M1140 0V420"/>
  </g>

  <!-- Customized OOTB Classic section: base plus the client's delta -->
  <g>
    <rect x="60" y="110" width="220" height="200" rx="12" fill="#0d1636" stroke="#6d81c4" stroke-width="1.8"/>
    <text x="80" y="138" fill="#8ea3d8" font-size="13" font-family="SFMono-Regular, Menlo, monospace">Calls · Classic</text>
    <g fill="#1b2a5b">
      <rect x="80" y="152" width="180" height="22" rx="5"/><rect x="80" y="182" width="180" height="22" rx="5"/>
    </g>
    <g fill="#16224d" stroke="#fbbf24" stroke-width="1.6">
      <rect x="80" y="212" width="180" height="22" rx="5"/><rect x="80" y="242" width="180" height="22" rx="5"/>
    </g>
    <g font-family="SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="90" y="167" fill="#6b7a9f">base field</text>
      <text x="90" y="197" fill="#6b7a9f">base field</text>
      <text x="90" y="227" fill="#fbbf24">+ client field</text>
      <text x="90" y="257" fill="#fbbf24">+ client detail</text>
    </g>
    <text x="80" y="292" fill="#8ea3d8" font-size="12">client delta</text>
    <circle cx="160" cy="288" r="5" fill="#fbbf24"/>
  </g>
  <text x="170" y="368" fill="#8ea3d8" font-size="17" letter-spacing="2.5" text-anchor="middle">CUSTOMIZED OOTB</text>

  <path d="M300 210H364" stroke="url(#beam1)" stroke-width="4" stroke-linecap="round"/>
  <path d="M370 210l-14-7v14z" fill="#8ab4ff"/>

  <!-- Existing Freedom page, two reconcile modes -->
  <g>
    <rect x="392" y="110" width="180" height="200" rx="12" fill="#101a3f" stroke="url(#freedom)" stroke-width="2.5"/>
    <rect x="404" y="122" width="156" height="24" rx="7" fill="url(#freedom)" opacity="0.9"/>
    <text x="482" y="139" fill="#ffffff" font-size="12" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">overlay</text>
    <g fill="#1b2a5b"><rect x="404" y="158" width="74" height="60" rx="6"/><rect x="486" y="158" width="74" height="60" rx="6"/></g>
    <g fill="#26386f"><rect x="412" y="168" width="58" height="12" rx="3"/><rect x="412" y="188" width="58" height="12" rx="3"/><rect x="494" y="168" width="58" height="12" rx="3"/></g>
    <rect x="494" y="188" width="58" height="12" rx="3" fill="#16224d" stroke="#fbbf24" stroke-width="1.4"/>
    <rect x="404" y="228" width="156" height="68" rx="6" fill="#1b2a5b"/>
    <g fill="#26386f"><rect x="412" y="238" width="140" height="12" rx="3"/><rect x="412" y="258" width="140" height="12" rx="3"/></g>
    <rect x="412" y="278" width="140" height="12" rx="3" fill="#16224d" stroke="#fbbf24" stroke-width="1.4"/>
  </g>
  <g>
    <rect x="590" y="110" width="180" height="200" rx="12" fill="#101a3f" stroke="url(#freedom)" stroke-width="2.5"/>
    <rect x="602" y="122" width="156" height="24" rx="7" fill="url(#freedom)" opacity="0.9"/>
    <text x="680" y="139" fill="#ffffff" font-size="12" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">classic-layout</text>
    <rect x="602" y="158" width="156" height="60" rx="6" fill="#1b2a5b"/>
    <g fill="#26386f"><rect x="610" y="166" width="140" height="10" rx="3"/><rect x="610" y="182" width="140" height="10" rx="3"/></g>
    <g fill="#16224d" stroke="#fbbf24" stroke-width="1.4"><rect x="610" y="198" width="140" height="12" rx="3"/></g>
    <rect x="602" y="228" width="156" height="68" rx="6" fill="#1b2a5b"/>
    <g fill="#16224d" stroke="#fbbf24" stroke-width="1.4"><rect x="610" y="238" width="140" height="12" rx="3"/></g>
    <g fill="#26386f"><rect x="610" y="258" width="140" height="12" rx="3"/></g>
    <rect x="610" y="278" width="140" height="12" rx="3" fill="none" stroke="#6b7a9f" stroke-width="1.4" stroke-dasharray="3 3"/>
  </g>
  <text x="581" y="96" fill="#9db4ff" font-size="14" letter-spacing="1.4" text-anchor="middle">PICK HOW IT LANDS</text>
  <text x="581" y="368" fill="#8ea3d8" font-size="17" letter-spacing="2.5" text-anchor="middle">EXISTING FREEDOM PAGE</text>

  <path d="M790 210H844" stroke="url(#beam2)" stroke-width="4" stroke-linecap="round"/>
  <path d="M850 210l-14-7v14z" fill="#34d399"/>

  <!-- Approval gate before the build -->
  <g>
    <g filter="url(#glow)">
      <rect x="872" y="120" width="268" height="180" rx="14" fill="#17295a" stroke="#8ab4ff" stroke-width="2"/>
    </g>
    <text x="896" y="152" fill="#c9d6ff" font-size="14" letter-spacing="0.6" font-family="SFMono-Regular, Menlo, monospace">decisions.md</text>
    <g font-size="13" font-family="SFMono-Regular, Menlo, monospace">
      <text x="896" y="186" fill="#8ea3d8">Plan version: 4</text>
      <text x="896" y="210" fill="#8ea3d8">Approved by: you</text>
    </g>
    <path d="M896 228H1116" stroke="#2c3d77" stroke-width="1.5"/>
    <g font-size="13" font-family="SFMono-Regular, Menlo, monospace">
      <text x="896" y="256" fill="#c9d6ff">--tasks</text>
      <text x="896" y="282" fill="#6b7a9f">ledger: atomic + lock</text>
    </g>
    <rect x="1050" y="166" width="66" height="50" rx="8" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
    <path d="M1066 166v-10a17 17 0 0 1 34 0v10" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <path d="M1070 192l8 8 16-16" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1100" cy="252" r="9" fill="none" stroke="#34d399" stroke-width="2"/>
    <path d="M1095 252l3 3 6-6" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="1006" y="368" fill="#c9d6ff" font-size="17" letter-spacing="2.5" text-anchor="middle">APPROVED BUILD</text>
</svg>
