    </g>
    <g fill="#26386f">
      <rect x="860" y="218" width="144" height="18" rx="4"/><rect x="860" y="242" width="144" height="18" rx="4"/><rect x="860" y="266" width="144" height="18" rx="4"/>
    </g>
    <rect x="860" y="242" width="144" height="18" rx="4" fill="none" stroke="#a78bfa" stroke-width="1.6"/>
    <rect x="1066" y="196" width="96" height="120" rx="10" fill="#101a3f" stroke="#a78bfa" stroke-width="2"/>
    <rect x="1076" y="208" width="76" height="16" rx="5" fill="url(#freedom)" opacity="0.85"/>
    <g fill="#1b2a5b"><rect x="1076" y="232" width="76" height="16" rx="5"/><rect x="1076" y="254" width="76" height="16" rx="5"/><rect x="1076" y="276" width="76" height="28" rx="5"/></g>
    <path d="M1004 251C1036 251 1036 240 1060 240" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M1066 240l-11-6v12z" fill="#a78bfa"/>
    <g filter="url(#glow)">
      <circle cx="1030" cy="322" r="24" fill="#0f2a22" stroke="#34d399" stroke-width="3"/>
      <path d="M1018 322l8 8 16-18" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
