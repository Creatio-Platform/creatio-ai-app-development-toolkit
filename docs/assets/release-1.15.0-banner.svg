      <path d="M507 276h10" stroke="#6b7a9f" stroke-width="2" stroke-linecap="round"/>
      <text x="530" y="281" fill="#6b7a9f">n/a  Print</text>
    </g>
  </g>
  <text x="602" y="100" fill="#9db4ff" font-size="14" letter-spacing="1.4" text-anchor="middle">DECISIONS APPLIED FIRST</text>
  <text x="602" y="368" fill="#8ea3d8" font-size="17" letter-spacing="2.5" text-anchor="middle">APPROVABLE PLAN</text>

  <path d="M742 214H806" stroke="url(#beam2)" stroke-width="4" stroke-linecap="round"/>
  <path d="M812 214l-14-7v14z" fill="#a78bfa"/>

  <!-- Freedom section: list page wired to a child page -->
  <g>
    <rect x="834" y="96" width="196" height="226" rx="12" fill="#101a3f" stroke="url(#freedom)" stroke-width="2.5"/>
    <rect x="848" y="110" width="168" height="30" rx="8" fill="url(#freedom)" opacity="0.9"/>
    <rect x="860" y="120" width="80" height="10" rx="5" fill="#ffffff" opacity="0.85"/>
    <g fill="#1b2a5b">
