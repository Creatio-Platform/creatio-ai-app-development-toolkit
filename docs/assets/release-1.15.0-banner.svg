      <text x="114" y="175" fill="#8ea3d8">insert Group</text>
      <text x="100" y="227" fill="#8ea3d8">merge Tab</text>
      <text x="86" y="279" fill="#8ea3d8">remove "e"</text>
    </g>
    <path d="M172 274H236" stroke="#9db4ff" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <rect x="248" y="263" width="46" height="22" rx="11" fill="#0e1735" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="271" y="278" fill="#fbbf24" font-size="11" text-anchor="middle" letter-spacing="0.8">NOTE</text>
  </g>
  <text x="220" y="368" fill="#8ea3d8" font-size="17" letter-spacing="2.5" text-anchor="middle">CLASSIC LAYERS</text>

  <path d="M392 214H456" stroke="url(#beam1)" stroke-width="4" stroke-linecap="round"/>
  <path d="M462 214l-14-7v14z" fill="#8ab4ff"/>

  <!-- Plan with decisions applied -->
  <g>
