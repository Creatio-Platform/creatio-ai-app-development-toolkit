    <rect x="96" y="148" width="240" height="44" rx="9" fill="#0d1636" stroke="#5c6fa3" stroke-width="1.6"/>
    <rect x="82" y="200" width="240" height="44" rx="9" fill="#111b40" stroke="#6d81c4" stroke-width="1.6"/>
    <rect x="68" y="252" width="240" height="44" rx="9" fill="#16224d" stroke="#6d81c4" stroke-width="1.6"/>
    <g font-family="SFMono-Regular, Menlo, monospace" font-size="13">
