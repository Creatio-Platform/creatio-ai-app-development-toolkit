<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1330"/><stop offset="0.55" stop-color="#152252"/><stop offset="1" stop-color="#1d2f6b"/>
    </linearGradient>
    <linearGradient id="freedom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="beam1" gradientUnits="userSpaceOnUse" x1="392" y1="214" x2="462" y2="214">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity="0.15"/><stop offset="1" stop-color="#8ab4ff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="beam2" gradientUnits="userSpaceOnUse" x1="742" y1="214" x2="812" y2="214">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity="0.15"/><stop offset="1" stop-color="#a78bfa" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <g opacity="0.10" stroke="#9db4ff" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200M0 360H1200"/>
    <path d="M60 0V420M180 0V420M300 0V420M420 0V420M540 0V420M660 0V420M780 0V420M900 0V420M1020 0V420M1140 0V420"/>
  </g>

  <!-- Classic section: a stack of layers, one with a no-op remove -->
  <g>
