      <rect x="484" y="118" width="236" height="192" rx="14" fill="#17295a" stroke="#8ab4ff" stroke-width="2"/>
    </g>
    <text x="602" y="150" fill="#c9d6ff" font-size="14" letter-spacing="0.6" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">plan.md</text>
    <g font-size="13" font-family="SFMono-Regular, Menlo, monospace">
