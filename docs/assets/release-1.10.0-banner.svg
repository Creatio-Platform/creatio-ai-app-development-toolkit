<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1330"/><stop offset="0.55" stop-color="#152252"/><stop offset="1" stop-color="#1d2f6b"/>
    </linearGradient>
    <linearGradient id="freedom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="470" y1="214" x2="742" y2="214">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity="0.15"/><stop offset="0.5" stop-color="#9cc0ff" stop-opacity="1"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="330" cy="238" r="69"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <g opacity="0.10" stroke="#9db4ff" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200M0 360H1200"/>
    <path d="M60 0V420M180 0V420M300 0V420M420 0V420M540 0V420M660 0V420M780 0V420M900 0V420M1020 0V420M1140 0V420"/>
  </g>

  <!-- Classic page: faded wireframe -->
  <g opacity="0.62">
    
    <rect x="78" y="96" width="330" height="232" rx="12" fill="#0a1130" stroke="#6d81c4" stroke-width="1.6"/>
    <rect x="78" y="96" width="330" height="34" rx="12" fill="#16224d"/>
    <rect x="78" y="118" width="330" height="12" fill="#16224d"/>
    <circle cx="97" cy="113" r="4" fill="#6d81c4"/><circle cx="111" cy="113" r="4" fill="#6d81c4"/><circle cx="125" cy="113" r="4" fill="#6d81c4"/>
    <g stroke="#6d81c4" stroke-width="1.4" stroke-dasharray="5 5">
      <rect x="98" y="150" width="130" height="18" rx="4"/><rect x="98" y="182" width="130" height="18" rx="4"/>
      <rect x="98" y="214" width="130" height="18" rx="4"/><rect x="248" y="150" width="140" height="18" rx="4"/>
      <rect x="248" y="182" width="140" height="18" rx="4"/><rect x="98" y="252" width="290" height="56" rx="6"/>
    </g>
  </g>
  <text x="243" y="360" fill="#8ea3d8" font-size="17" letter-spacing="2.5" text-anchor="middle">CLASSIC</text>

  <!-- magnifier revealing source -->
  <g filter="url(#glow)">
    <circle cx="330" cy="238" r="72" fill="#0a1130" stroke="#8ab4ff" stroke-width="3"/>
    <g clip-path="url(#lens)">
      <rect x="258" y="166" width="144" height="144" fill="#070c22"/>
      <g font-family="SFMono-Regular, Menlo, monospace" font-size="11">
        <text x="280" y="196" fill="#7dd3fc">onSaved</text><text x="330" y="196" fill="#94a3b8">()</text>
        <text x="280" y="214" fill="#c4b5fd">rule</text><text x="306" y="214" fill="#94a3b8">: visible</text>
        <text x="280" y="232" fill="#86efac">esq</text><text x="298" y="232" fill="#94a3b8">.filter</text>
        <text x="280" y="250" fill="#fbbf24">column</text><text x="320" y="250" fill="#94a3b8">: Amount</text>
        <text x="280" y="268" fill="#7dd3fc">detail</text><text x="318" y="268" fill="#94a3b8">: Products</text>
        <text x="280" y="286" fill="#94a3b8">diff: insert</text>
      </g>
    </g>
    <line x1="381" y1="289" x2="424" y2="332" stroke="#8ab4ff" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- mapping beam with nodes -->
  <g>
    <path d="M470 214H742" stroke="url(#beam)" stroke-width="4" stroke-linecap="round"/>
    <path d="M742 214l-14-7v14z" fill="#a78bfa"/>
    <g fill="#0a1130" stroke="#8ab4ff" stroke-width="2">
      <circle cx="530" cy="214" r="8"/><circle cx="606" cy="214" r="8"/><circle cx="682" cy="214" r="8"/>
    </g>
    <g fill="#8ab4ff"><circle cx="530" cy="214" r="3"/><circle cx="606" cy="214" r="3"/><circle cx="682" cy="214" r="3"/></g>
    <text x="606" y="180" fill="#9db4ff" font-size="14" letter-spacing="1.4" text-anchor="middle">ANALYZE · MAP · PLAN</text>
  </g>

  <!-- Freedom page -->
  <g>
    <rect x="792" y="86" width="330" height="252" rx="16" fill="#101a3f" stroke="url(#freedom)" stroke-width="2.5"/>
    <rect x="792" y="86" width="330" height="44" rx="16" fill="url(#freedom)" opacity="0.9"/>
    <rect x="792" y="112" width="330" height="18" fill="url(#freedom)" opacity="0.9"/>
    <rect x="812" y="100" width="96" height="14" rx="7" fill="#ffffff" opacity="0.85"/>
    <g fill="#1b2a5b">
      <rect x="812" y="152" width="130" height="34" rx="8"/><rect x="812" y="198" width="130" height="34" rx="8"/>
      <rect x="962" y="152" width="140" height="34" rx="8"/><rect x="962" y="198" width="140" height="34" rx="8"/>
      <rect x="812" y="248" width="290" height="66" rx="10"/>
    </g>
    <g fill="#6f8ad6">
      <rect x="822" y="163" width="70" height="8" rx="4"/><rect x="822" y="209" width="86" height="8" rx="4"/>
      <rect x="972" y="163" width="80" height="8" rx="4"/><rect x="972" y="209" width="60" height="8" rx="4"/>
      <rect x="824" y="262" width="120" height="8" rx="4"/><rect x="824" y="282" width="240" height="6" rx="3"/><rect x="824" y="296" width="200" height="6" rx="3"/>
    </g>
    <rect x="1062" y="252" width="44" height="18" rx="9" fill="url(#freedom)"/>
  </g>
  <text x="957" y="368" fill="#c9d6ff" font-size="17" letter-spacing="2.5" text-anchor="middle">FREEDOM</text>
</svg>
