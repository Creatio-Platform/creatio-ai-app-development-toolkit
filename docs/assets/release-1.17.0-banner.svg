<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1330"/><stop offset="0.55" stop-color="#152252"/><stop offset="1" stop-color="#1d2f6b"/>
    </linearGradient>
    <linearGradient id="freedom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="beam1" gradientUnits="userSpaceOnUse" x1="500" y1="210" x2="556" y2="210">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity="0.15"/><stop offset="1" stop-color="#8ab4ff" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <g opacity="0.10" stroke="#9db4ff" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200M0 360H1200"/>
    <path d="M60 0V420M180 0V420M300 0V420M420 0V420M540 0V420M660 0V420M780 0V420M900 0V420M1020 0V420M1140 0V420"/>
  </g>

  <!-- App plan with a portal section, roles and users -->
  <g>
    <rect x="60" y="100" width="280" height="220" rx="12" fill="#0d1636" stroke="#6d81c4" stroke-width="1.8"/>
    <text x="80" y="130" fill="#8ea3d8" font-size="13" font-family="SFMono-Regular, Menlo, monospace">Business Plan</text>
    <path d="M80 142H320" stroke="#2c3d77" stroke-width="1.5"/>
    <g font-family="SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="80" y="166" fill="#c9d6ff">2. Roles and Permissions</text>
      <text x="96" y="186" fill="#6b7a9f">roles to create: 2</text>
      <text x="96" y="204" fill="#6b7a9f">users to create: 3</text>
      <text x="80" y="234" fill="#fbbf24">8. Portal section</text>
      <text x="96" y="254" fill="#6b7a9f">external access: read</text>
      <text x="96" y="272" fill="#6b7a9f">record scope: own account</text>
    </g>
    <g fill="none" stroke="#fbbf24" stroke-width="1.8">
      <circle cx="304" cy="244" r="7"/>
      <path d="M292 268a12 12 0 0 1 24 0"/>
    </g>
    <circle cx="80" cy="300" r="4" fill="#34d399"/>
    <text x="92" y="304" fill="#8ea3d8" font-size="12">applied by the build</text>
  </g>
  <text x="200" y="368" fill="#8ea3d8" font-size="17" letter-spacing="2.5" text-anchor="middle">PORTAL IN THE PLAN</text>

  <!-- Classic radio group and Connected to, migrated to Freedom components -->
  <g>
    <rect x="380" y="130" width="120" height="160" rx="12" fill="#0d1636" stroke="#6d81c4" stroke-width="1.8"/>
    <text x="440" y="156" fill="#8ea3d8" font-size="12" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">Classic</text>
    <g fill="none" stroke="#6b7a9f" stroke-width="1.6">
      <circle cx="400" cy="182" r="6"/><circle cx="400" cy="204" r="6"/><circle cx="400" cy="226" r="6"/>
    </g>
    <circle cx="400" cy="204" r="3" fill="#6b7a9f"/>
    <g fill="#1b2a5b"><rect x="412" y="176" width="72" height="12" rx="3"/><rect x="412" y="198" width="72" height="12" rx="3"/><rect x="412" y="220" width="72" height="12" rx="3"/></g>
    <rect x="394" y="248" width="92" height="28" rx="5" fill="#1b2a5b"/>
    <text x="440" y="266" fill="#6b7a9f" font-size="10" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">Connected to</text>
  </g>
  <path d="M510 210H550" stroke="url(#beam1)" stroke-width="4" stroke-linecap="round"/>
  <path d="M556 210l-14-7v14z" fill="#8ab4ff"/>
  <g>
    <rect x="568" y="110" width="200" height="200" rx="12" fill="#101a3f" stroke="url(#freedom)" stroke-width="2.5"/>
    <rect x="580" y="122" width="176" height="24" rx="7" fill="url(#freedom)" opacity="0.9"/>
    <text x="668" y="139" fill="#ffffff" font-size="12" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">crt.RadioGroup</text>
    <g fill="none" stroke="#8ab4ff" stroke-width="1.8">
      <circle cx="592" cy="166" r="7"/><circle cx="592" cy="190" r="7"/><circle cx="592" cy="214" r="7"/>
    </g>
    <circle cx="592" cy="190" r="3.5" fill="#8ab4ff"/>
    <g fill="#26386f"><rect x="606" y="160" width="120" height="12" rx="3"/><rect x="606" y="184" width="120" height="12" rx="3"/><rect x="606" y="208" width="120" height="12" rx="3"/></g>
    <rect x="580" y="236" width="176" height="62" rx="7" fill="#1b2a5b"/>
    <text x="592" y="254" fill="#c9d6ff" font-size="11" font-family="SFMono-Regular, Menlo, monospace">crt.Connections</text>
    <g fill="#16224d" stroke="#34d399" stroke-width="1.4">
      <rect x="592" y="264" width="66" height="22" rx="11"/><rect x="666" y="264" width="78" height="22" rx="11"/>
    </g>
    <g fill="#9fe7c8" font-size="10" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">
      <text x="625" y="279">Account</text><text x="705" y="279">Contact</text>
    </g>
  </g>
  <text x="574" y="368" fill="#8ea3d8" font-size="17" letter-spacing="2.5" text-anchor="middle">CLASSIC TO FREEDOM</text>

  <!-- Root-cause analysis agent -->
  <g>
    <g filter="url(#glow)">
      <rect x="820" y="110" width="320" height="200" rx="14" fill="#17295a" stroke="#8ab4ff" stroke-width="2"/>
    </g>
    <text x="844" y="142" fill="#c9d6ff" font-size="14" letter-spacing="0.6" font-family="SFMono-Regular, Menlo, monospace">rca-orchestration</text>
    <path d="M844 156H1116" stroke="#2c3d77" stroke-width="1.5"/>
    <g font-size="12" font-family="SFMono-Regular, Menlo, monospace">
      <text x="844" y="182" fill="#8ea3d8">evidence: activity log</text>
      <text x="844" y="206" fill="#8ea3d8">playbook: matched</text>
      <text x="844" y="230" fill="#8ea3d8">mode: read-only</text>
      <text x="844" y="268" fill="#34d399">root cause</text>
      <text x="844" y="288" fill="#6b7a9f">report with evidence</text>
    </g>
    <circle cx="1068" cy="214" r="30" fill="none" stroke="#34d399" stroke-width="3"/>
    <path d="M1090 236l22 22" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
    <path d="M1056 214l8 8 16-16" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="980" y="368" fill="#c9d6ff" font-size="17" letter-spacing="2.5" text-anchor="middle">ROOT-CAUSE AGENT</text>
</svg>
