    <rect x="906" y="62" width="56" height="8" rx="4" fill="#1b2a5b"/>
    <rect x="864" y="80" width="140" height="36" rx="10" fill="url(#freedom)" opacity="0.9"/>
    <rect x="876" y="92" width="70" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
    <g fill="#1b2a5b">
      <rect x="864" y="128" width="140" height="30" rx="8"/><rect x="864" y="166" width="140" height="30" rx="8"/>
      <rect x="864" y="204" width="140" height="30" rx="8"/><rect x="864" y="242" width="140" height="56" rx="9"/>
    </g>
    <g fill="#6f8ad6">
      <rect x="874" y="139" width="70" height="8" rx="4"/><rect x="874" y="177" width="90" height="8" rx="4"/>
      <rect x="874" y="215" width="60" height="8" rx="4"/>
      <rect x="874" y="254" width="104" height="6" rx="3"/><rect x="874" y="268" width="84" height="6" rx="3"/><rect x="874" y="282" width="96" height="6" rx="3"/>
