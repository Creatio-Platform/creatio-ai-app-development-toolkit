    <rect x="140" y="112" width="140" height="12" rx="6" fill="#0a1130"/>
    <g fill="#1b2a5b">
      <rect x="90" y="152" width="124" height="30" rx="7"/><rect x="226" y="152" width="124" height="30" rx="7"/>
      <rect x="90" y="192" width="124" height="30" rx="7"/><rect x="226" y="192" width="124" height="30" rx="7"/>
      <rect x="90" y="234" width="260" height="76" rx="9"/>
    </g>
    <g fill="#6d81c4">
      <rect x="100" y="163" width="70" height="8" rx="4"/><rect x="236" y="163" width="84" height="8" rx="4"/>
      <rect x="100" y="203" width="88" height="8" rx="4"/><rect x="236" y="203" width="60" height="8" rx="4"/>
      <rect x="102" y="248" width="110" height="8" rx="4"/>
      <rect x="102" y="268" width="226" height="6" rx="3"/><rect x="102" y="282" width="196" height="6" rx="3"/><rect x="102" y="296" width="150" height="6" rx="3"/>
    </g>
  </g>
  <text x="220" y="368" fill="#8ea3d8" font-size="17" letter-spacing="2.5" text-anchor="middle">FREEDOM UI WEB PAGE</text>

  <path d="M392 214H456" stroke="url(#beam1)" stroke-width="4" stroke-linecap="round"/>
  <path d="M462 214l-14-7v14z" fill="#8ab4ff"/>

  <!-- Converter, no feature flag -->
  <g>
    <g filter="url(#glow)">
      <rect x="484" y="150" width="236" height="128" rx="14" fill="#17295a" stroke="#8ab4ff" stroke-width="2"/>
    </g>
    <text x="602" y="186" fill="#c9d6ff" font-size="13" letter-spacing="0.6" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">mobile-page-converter</text>
    <g opacity="0.55">
      <rect x="520" y="208" width="64" height="32" rx="16" fill="#0e1735" stroke="#50638f" stroke-width="2"/>
      <circle cx="537" cy="224" r="10" fill="#50638f"/>
      <text x="598" y="230" fill="#6b7a9f" font-size="15" font-family="SFMono-Regular, Menlo, monospace">--enable</text>
    </g>
    <path d="M512 250L694 198" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="602" y="134" fill="#9db4ff" font-size="14" letter-spacing="1.4" text-anchor="middle">AVAILABLE BY DEFAULT</text>
  <text x="602" y="368" fill="#8ea3d8" font-size="17" letter-spacing="2.5" text-anchor="middle">NO FEATURE FLAG</text>

  <path d="M742 214H806" stroke="url(#beam2)" stroke-width="4" stroke-linecap="round"/>
  <path d="M812 214l-14-7v14z" fill="#a78bfa"/>

