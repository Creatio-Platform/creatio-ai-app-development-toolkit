# SonarCloud Automatic Analysis reads THIS file — `.sonarcloud.properties` — from the repository's
# DEFAULT branch. It IGNORES `sonar-project.properties` entirely (that file is only for the CI-based
# scanner). See: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
#
# `sonar.exclusions` is a FILTER, not an assertion: the excluded paths below are added by the
# Classic→Freedom migration-skill PR (Creatio-Platform/creatio-ai-app-development-toolkit#46) and do
# NOT exist on `main` yet — so they match zero files here and simply begin excluding once that PR lands
# (harmless on `main` in the meantime). Keep these globs in sync if #46's layout changes, and re-verify
# on the SonarCloud dashboard once both land. (`sonar.tests` is intentionally NOT set: unlike an
# exclusion filter, it is an assertion the scanner can hard-fail on when its path is absent — and the
# fixture exclusion below needs only `sonar.exclusions`.)
#
# Why exclude these paths (not first-party source; they produced ~100 false "new code smells", mostly CRITICAL):
#   1. engine-tests/**/fixtures/** — verbatim Creatio Classic UI schema bodies used as ENGINE INPUT DATA
#      in the golden suites. Intentionally legacy ES5 (`var`, nested ternaries, …): what the engine consumes.
#   2. skills/classic-to-freedom-migration/engine/vendor/** — the pinned, vendored acorn parser. NOTE:
#      excluding it also removes it from SAST / Security-Hotspot scanning; its integrity is enforced by
#      verify-vendor.mjs (SHA-256 pin), not by an automated vulnerability scan — any re-vendoring of it
#      must go through that gate.
#   3. skills/classic-to-freedom-migration/engine/registry/** — the GENERATED component index
#      (scripts/build-registry-index.mjs, from the CDN component registries). Third-party data, not
#      hand-maintained source: it is regenerated wholesale, so a finding in it can only be fixed in the
#      generator. The generator itself is NOT excluded.

sonar.exclusions=skills/classic-to-freedom-migration/engine/vendor/**,skills/classic-to-freedom-migration/engine/registry/**,engine-tests/**/fixtures/**
