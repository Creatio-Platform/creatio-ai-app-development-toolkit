# SonarCloud Automatic Analysis reads THIS file — `.sonarcloud.properties` — from the repository's
# DEFAULT branch. It IGNORES `sonar-project.properties` entirely (that file is only for the CI-based
# scanner). See: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
#
# NOTE: because autoscan reads this from the DEFAULT branch, exclusions only take effect once this file
# is on `main` (or is set in SonarCloud → Administration → Analysis Scope). A copy on a feature branch
# alone does not change that branch's / its PR's analysis scope.
#
# Why exclude these paths (they are not first-party source; they produced ~100 false "new code smells"):
#   1. engine-tests/**/fixtures/** — verbatim Creatio Classic UI schema bodies used as ENGINE INPUT
#      DATA in the golden suites. Intentionally legacy ES5 (`var`, nested ternaries, …): that is what
#      the migration engine consumes. Linting them as our code is noise, not signal.
#   2. the vendored acorn parser — pinned third-party code (integrity-gated by verify-vendor.mjs).

sonar.exclusions=skills/classic-to-freedom-migration/engine/vendor/**,engine-tests/**/fixtures/**
sonar.tests=engine-tests
