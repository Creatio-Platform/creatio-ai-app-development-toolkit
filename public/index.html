<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creatio AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .example {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
        }

        .example strong {
            color: #333;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 10px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result.show {
            display: block;
        }

        .result.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .result h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .result p {
            margin: 5px 0;
            line-height: 1.6;
        }

        .result a {
            color: inherit;
            text-decoration: underline;
            word-break: break-all;
        }

        .schema-info {
            background: rgba(255, 255, 255, 0.5);
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .schema-info p {
            margin: 5px 0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Creatio AI Assistant</h1>
        <p class="subtitle">Керуйте Creatio природною мовою</p>

        <div class="example">
            <strong>Приклади команд:</strong><br>
            • "створи схему з назвою AccountPage"<br>
            • "зроби нову сторінку CustomerForm"<br>
            • "create schema named OrderPage"<br>
            • "extend BasePageV2"<br>
            • "покажи інфо про схему ContactPage"
        </div>

        <form id="schemaForm">
            <div class="input-group">
                <label for="command">Що потрібно зробити?</label>
                <textarea 
                    id="command" 
                    name="command" 
                    placeholder="Наприклад: створи схему з назвою MyTestPage"
                    required
                ></textarea>
            </div>

            <button type="submit" id="submitBtn">
                Виконати
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>AI обробляє ваш запит...</p>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script>
        const form = document.getElementById('schemaForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const commandInput = document.getElementById('command');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const command = commandInput.value.trim();
            if (!command) return;

            // Show loading
            submitBtn.disabled = true;
            loading.classList.add('active');
            result.classList.remove('show');

            try {
                const response = await fetch('/agent/creatio', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: command
                    })
                });

                const data = await response.json();

                // Hide loading
                loading.classList.remove('active');
                submitBtn.disabled = false;

                // Show result
                result.classList.add('show');

                if (data.success) {
                    result.className = 'result show success';
                    
                    let resultHTML = `<h3>✅ ${data.message || 'Операцію виконано успішно!'}</h3>`;
                    
                    // Show schema details if created
                    if (data.schemaUId && data.schemaName) {
                        resultHTML += `
                            <div class="schema-info">
                                <p><strong>Назва схеми:</strong> ${data.schemaName}</p>
                                <p><strong>GUID:</strong> ${data.schemaUId}</p>
                                ${data.schemaType ? `<p><strong>Тип:</strong> ${data.schemaType}</p>` : ''}
                            </div>
                        `;
                        
                        if (data.creatio_url) {
                            resultHTML += `
                                <p style="margin-top: 12px;">
                                    <a href="${data.creatio_url}" target="_blank">
                                        Відкрити в Creatio →
                                    </a>
                                </p>
                            `;
                        }
                    }
                    
                    // Show reasoning if provided
                    if (data.reasoning) {
                        resultHTML += `<p style="margin-top: 10px; font-size: 13px; opacity: 0.8;"><em>${data.reasoning}</em></p>`;
                    }
                    
                    result.innerHTML = resultHTML;
                } else {
                    result.className = 'result show error';
                    result.innerHTML = `
                        <h3>❌ ${data.operation === 'not_supported' ? 'Функція не підтримується' : 'Помилка'}</h3>
                        <p>${data.message || data.error || 'Невідома помилка'}</p>
                        ${data.reasoning ? `<p style="margin-top: 10px; font-size: 13px;"><em>${data.reasoning}</em></p>` : ''}
                    `;
                }
            } catch (error) {
                loading.classList.remove('active');
                submitBtn.disabled = false;
                result.classList.add('show');
                result.className = 'result show error';
                result.innerHTML = `
                    <h3>❌ Помилка з'єднання</h3>
                    <p>Не вдалося підключитися до сервера: ${error.message}</p>
                    <p>Переконайтеся, що сервер запущено на http://localhost:3000</p>
                `;
            }
        });

        // Auto-resize textarea
        commandInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
    </script>
</body>
</html>
