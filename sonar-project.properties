# SonarQube Cloud (SonarCloud) project configuration.
#
# IMPORTANT: organization and projectKey must match exactly what SonarCloud
# shows after you import the repo (My Projects -> the project -> Information).
# The values below are SonarCloud's default naming when importing from the
# Creatio-Platform GitHub org; adjust if your SonarCloud setup differs.
sonar.organization=creatio-platform
sonar.projectKey=Creatio-Platform_creatio-ai-app-development-toolkit
sonar.projectName=Creatio AI App Development Toolkit

# Analyzed code (scripts + runtime + installer + skills). Docs/context are
# Markdown and intentionally excluded from code analysis.
sonar.sources=installer,runtime,scripts,skills

# Test sources and Python coverage report (produced in CI by pytest-cov).
sonar.tests=tests
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/__pycache__/**,**/*.pyc
