# SonarCloud analysis scope (read by SonarCloud Automatic Analysis).
#
# Why this file exists: without it, Automatic Analysis lints EVERY file in the repo as first-party
# source. Two categories here are not first-party source and were producing the bulk of the reported
# "new code smells" (almost all of the CRITICAL ones):
#
#   1. engine-tests/**/fixtures/** — verbatim Creatio Classic UI schema bodies used as ENGINE INPUT
#      DATA in the golden suites. They are intentionally legacy ES5 (`var`, nested ternaries, etc.):
#      that is what the migration engine consumes. Linting them as our code is noise, not signal.
#   2. the vendored acorn parser — pinned third-party code whose integrity is enforced by
#      verify-vendor.mjs; it is not ours to restyle.
#
# Effect is applied on the next SonarCloud analysis of this branch.

sonar.exclusions=skills/classic-to-freedom-migration/engine/vendor/**, engine-tests/**/fixtures/**

# The golden runners are test code, not production source — scope them as tests so test-inappropriate
# rules are relaxed. (The fixtures under engine-tests are already dropped by sonar.exclusions above.)
sonar.tests=engine-tests
sonar.test.inclusions=engine-tests/**/*.mjs
