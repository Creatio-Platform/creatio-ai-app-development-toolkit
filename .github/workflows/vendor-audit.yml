name: Vendored dependency audit

# Compensating control for code excluded from SonarCloud + outside SCA (the vendored acorn parser):
# weekly OSV check against the pinned vendored version so a CVE disclosed against it is surfaced even
# though it is not tracked in package.json / Dependabot. See scripts/audit-vendored-acorn.mjs.
# Scheduled workflows run only from the default branch, so this must live on `main`.

on:
  schedule:
    - cron: '17 6 * * 1'   # weekly — Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    name: OSV check on pinned vendored parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
      - name: OSV audit of vendored pins
        run: node scripts/audit-vendored-acorn.mjs
