name: Sonar config check

# Guards .sonarcloud.properties so an exclusion glob that silently stops matching (a fixture/vendor
# path renamed or moved) fails loudly instead of quietly re-surfacing the smells it suppresses.
# Window-safe: globs whose base dir does not exist yet are skipped (see scripts/check-sonar-exclusions.mjs).

on:
  # No `branches:` filter on purpose: with `[main]` a PR stacked on a feature base skipped
  # this check, so a broken exclusion glob surfaced only once the stack reached main.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  exclusions:
    name: sonar.exclusions globs match real files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Check sonar.exclusions globs still match files
        run: node scripts/check-sonar-exclusions.mjs
