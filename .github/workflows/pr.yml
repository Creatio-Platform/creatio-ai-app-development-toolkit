name: PR checks

on:
  # ENG-95683 review — NO `branches:` filter. It used to be `[main]`, which meant these checks (the workspace
  # suites AND `build-workflows.mjs --check`, the ONLY gate that stops a generated `.workflow.js` from drifting
  # from its `_workflow-core/` source) never ran on a PR targeting anything else. This PR targets a feature base
  # (`ENG-94529-migration-stage-2-poc`), so it got ZERO workflow runs — and a hand-edit to the generated
  # `freedom-build-executor.workflow.js` (commit 3b6261a) landed green, with the source left behind, until a
  # reviewer caught it by eye. A stacked PR is exactly where drift is most likely and was least checked.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        # --only-binary :all: → wheels only, so no source-dist setup scripts run (S8541); pinned version (S8544).
        # Quoted: the unquoted `:all: ` (colon-space) makes YAML parse this as a nested mapping → workflow startup_failure.
        run: "pip install --only-binary :all: pytest==8.3.4"
      - name: Run tests
        # Both suites: the repo-root tests/ and the out-of-tree cost-counter
        # suite (its tests/__init__.py puts cost-counter/ on sys.path so the
        # bare `import export` / `import metrics` resolve). Without the second
        # path the cost-counter suite is never run in CI.
        run: pytest tests/ skills/classic-to-freedom-migration/tools/cost-counter/tests/

  version-check:
    name: Manifest version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Check manifest sync
        run: node scripts/bump-version.js --check

  vendor-upstream:
    name: Vendored parser authenticity (upstream npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      # supply-chain AUTHENTICITY anchor (the other half of verify-vendor.mjs): independently fetch the pinned
      # acorn from the npm registry, verify the tarball against the registry's own dist.integrity, and confirm
      # the vendored file's SHA-256 equals what npm publishes — so a pin bumped WITHOUT re-vendoring is caught
      # in the PR, not just tamper-evidenced against a same-commit pin.
      - name: Anchor vendored parser to upstream npm
        run: node skills/classic-to-freedom-migration/engine/verify-vendor-upstream.mjs

  engine-goldens:
    name: Classic→Freedom engine goldens (${{ matrix.os }})
    strategy:
      fail-fast: false   # a failure on one OS must NOT cancel the other — the engine + verify-vendor deliberately normalize CRLF/LF, so a platform-specific red is exactly the signal we need to see
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      # supply-chain gate: the vendored acorn parser (the one executable processing untrusted schema-body)
      # must match its pinned upstream SHA-256 — a swapped/drifted bundle fails the build here.
      - name: Verify vendored parser integrity
        run: node skills/classic-to-freedom-migration/engine/verify-vendor.mjs
      # zero-dependency pure-ESM goldens (live in engine-tests/, outside the shipped skill); import the
      # runtime engine from skills/…/engine. Each runner exits 1 on any failed check.
      - name: Run merge goldens
        if: always()   # run even if the integrity gate failed, so its result is still visible
        working-directory: engine-tests/classic-to-freedom
        run: node run.mjs
      - name: Run mapper goldens
        if: always()   # run even if the merge goldens failed, so one runner's failure never hides the other's results
        working-directory: engine-tests/classic-to-freedom
        run: node run-mapper.mjs
      # offline unit tests for the hand-rolled infra parsers (ustar reader / integrity / sonar glob matcher) that
      # otherwise run only inside live-network / real-tree jobs — deterministic, network-free coverage.
      - name: Run infra-parser goldens
        if: always()
        working-directory: engine-tests/classic-to-freedom
        run: node run-infra.mjs
      # The shipped Claude `.workflow.js` files are GENERATED from skills/_workflow-core/ (a workflow script cannot
      # `import`, so the host-neutral core is inlined into them). This is the drift gate: an edit to the generated
      # file alone, or a core edit that was never re-generated, fails here instead of shipping two divergent
      # orchestrations — the Claude one and the one Codex runs through the CLI.
      - name: Workflow core ↔ generated workflow in sync
        if: always()
        run: node scripts/build-workflows.mjs --check
      # The host-neutral core itself: the work-item protocol's three outcomes, capability negotiation (an explicit
      # stop, never a silent degradation), journal replay/resume, CROSS-HOST PARITY (the Claude adapter and the CLI
      # must return the identical result), and an evaluation of the generated file the way the host evaluates it.
      - name: Run workflow-core goldens
        if: always()
        working-directory: engine-tests/classic-to-freedom
        run: node run-workflow-core.mjs
      # DIFFERENTIAL: the generated workflow scripts against the hand-written baselines they replaced, driven the
      # way the Claude host drives them. Identical phase sequence, identical agent dispatch order, identical
      # PROMPTS byte for byte, identical return value — the acceptance criterion "existing Claude Code behavior
      # remains unchanged", asserted rather than asserted-about. The baselines under `baseline/` are frozen; a
      # deliberate behaviour change replaces them in its own reviewed commit.
      - name: Run workflow parity goldens (shipped vs baseline)
        if: always()
        working-directory: engine-tests/classic-to-freedom
        run: node run-workflow-parity.mjs
      # ENG-95470 (defect 1) — offline regression guard for freedom-build-executor's round-churn predicate.
      - name: Run freedom-build-executor round-guard golden
        if: always()
        working-directory: engine-tests/freedom-build-executor
        run: node round-guard.mjs
