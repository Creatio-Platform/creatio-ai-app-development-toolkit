name: Security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly full scan (Mondays 06:00 UTC) to catch newly-disclosed issues
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets - gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.21.2
          GITLEAKS_SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          mkdir -p "$RUNNER_TEMP/bin"
          TARBALL="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$TARBALL"
          # Verify the download integrity before trusting/executing the binary.
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify gitleaks
        run: gitleaks version
      - name: Scan working tree for secrets
        # Scans the current working tree; exits non-zero when leaks are found.
        run: gitleaks dir . --redact -v
      - name: Scan full git history for secrets
        # Scans the entire commit history (checkout uses fetch-depth: 0).
        # A working-tree scan alone misses secrets that were committed and
        # later removed but still live in history. Exits non-zero on findings.
        run: gitleaks git . --redact -v
