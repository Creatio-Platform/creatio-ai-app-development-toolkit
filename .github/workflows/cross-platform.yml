name: Cross Platform

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            smoke_filter: UnixWrapperSmokeTests
          - os: windows-latest
            smoke_filter: PowerShellWrapperSmokeTests
          - os: macos-latest
            smoke_filter: UnixWrapperSmokeTests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run full test suite
        run: python -m pytest -q
      - name: Run wrapper smoke tests
        run: python -m pytest -q tests/test_cross_platform_wrappers.py -k "${{ matrix.smoke_filter }}"
